name: Update Stock Data

on:
  schedule:
    # 24시간 매시 0분 (주말 포함). 하루 24회.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run fetch_data
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python src/fetch_data.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data.json public/stocks.json public/sbsbiz.json 2>/dev/null; then
            echo "No data changes."
            exit 0
          fi
          git add public/data.json public/stocks.json public/sbsbiz.json
          git commit -m "chore(data): auto-update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
