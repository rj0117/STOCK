name: Update Stock Data

on:
  schedule:
    # 24시간 매시 0분/30분 (주말 포함). 하루 48회 · 30분 간격.
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run fetch_data
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python src/fetch_data.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data.json public/stocks.json public/sbsbiz.json 2>/dev/null; then
            echo "No data changes."
            exit 0
          fi
          git add public/data.json public/stocks.json public/sbsbiz.json
          git commit -m "chore(data): auto-update $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # 최대 3번 재시도 (push 충돌 대비)
          for i in 1 2 3; do
            echo "Push 시도 $i..."
            if git push; then
              echo "Push 성공"
              exit 0
            fi
            echo "충돌 감지, rebase 후 재시도..."
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; echo "Rebase 실패, 다음 cron에서 재시도"; exit 0; }
            sleep 3
          done
          echo "3회 재시도 모두 실패"
          exit 1
