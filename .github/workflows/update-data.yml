name: Update Stock Data

on:
  schedule:
    # 비정시(매시 7분/37분)로 부하 시간대 회피 — GitHub Actions schedule은
    # 매시 0/30분에 자주 누락됨. 하루 48회 · 30분 간격.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write YouTube cookies (SBS Biz 자막 봇 차단 우회)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
            echo "YOUTUBE_COOKIES_FILE=/tmp/yt_cookies.txt" >> "$GITHUB_ENV"
            echo "쿠키 파일 생성 완료 ($(wc -l < /tmp/yt_cookies.txt) lines)"
          else
            echo "[INFO] YOUTUBE_COOKIES secret 미설정 — 자막은 title 폴백으로만 동작"
          fi

      - name: Run fetch_data
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 위 step 에서 GITHUB_ENV 로 전달된 YOUTUBE_COOKIES_FILE 가 자동 흘러들어감
        run: python src/fetch_data.py

      - name: Commit & push if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATA_FILES="public/data.json public/stocks.json public/sbsbiz.json public/flow_by_code.json public/buy_history.json public/backtest.json"

          # 변경 없으면 종료
          CHANGED=0
          for f in $DATA_FILES; do
            if [ -f "$f" ] && ! git diff --quiet -- "$f" 2>/dev/null; then
              CHANGED=1
              break
            fi
            # 새 파일(추적 안된)도 변경으로 간주
            if [ -f "$f" ] && ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              CHANGED=1
              break
            fi
          done
          if [ "$CHANGED" = "0" ]; then
            echo "No data changes."
            exit 0
          fi

          # 갱신된 데이터 파일을 임시 위치로 백업
          BAK=$(mktemp -d)
          for f in $DATA_FILES; do
            [ -f "$f" ] && cp "$f" "$BAK/$(basename $f)"
          done

          # 최대 8번 재시도: origin main 위에 데이터를 다시 올려놓고 커밋·푸시
          # 짧은 sleep (2~5초)로 5회 안에 끝나도록 — 사람 push 와 충돌 시 빠르게 패치
          for i in 1 2 3 4 5 6 7 8; do
            echo "Push 시도 $i..."
            git fetch origin main
            git reset --hard origin/main

            # 백업해둔 데이터 복원
            for f in $DATA_FILES; do
              base=$(basename $f)
              [ -f "$BAK/$base" ] && cp "$BAK/$base" "$f"
            done

            git add $DATA_FILES 2>/dev/null || true

            # reset 후에도 실제 변경이 없으면(이미 누군가가 같은 내용 push) 종료
            if git diff --cached --quiet; then
              echo "이미 최신, 종료"
              exit 0
            fi

            git commit -m "chore(data): auto-update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push; then
              echo "Push 성공"
              exit 0
            fi
            echo "Push 실패, ${i}회 시도, 재시도 대기..."
            sleep $((2 + (i % 4)))
          done
          # 8회 다 실패해도 워크플로 자체는 success로 — 다음 cron이 다시 시도
          # (failure로 두면 alert만 시끄럽고 의미 없음)
          echo "8회 재시도 실패. 다음 cron에서 재시도하므로 정상 종료."
          exit 0
